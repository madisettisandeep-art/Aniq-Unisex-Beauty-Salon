# ============================================================================
# ANIQ UNISEX BEAUTY SALON & TATTOO — PRODUCTION LOAD BALANCER & CDN CONFIG
# ============================================================================

worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Optimize TCP & Keepalive
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Compress API Payloads, JS, CSS, SVG & JSON
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # Upstream Load Balancer Cluster (Least Connections + Keepalive Pool)
    upstream aniq_nextjs_cluster {
        least_conn;
        server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
        server 127.0.0.1:3001 backup;
        keepalive 64;
    }

    # Proxy Cache Zone for Server-Side Edge Caching
    proxy_cache_path /var/cache/nginx/aniq_cache levels=1:2 keys_zone=ANIQ_CACHE:20m max_size=1g inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name aniqsalon.in www.aniqsalon.in localhost;

        # Static Media CDN Edge Delivery (Videos, Posters, High-Res Images)
        location ~* ^/(videos|posters|images|_next/static)/ {
            proxy_pass http://aniq_nextjs_cluster;
            proxy_cache ANIQ_CACHE;
            proxy_cache_valid 200 365d;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Cached Read-Only API Endpoints (/api/services, /api/masters, /api/slots)
        location ~* ^/api/(services|masters|slots) {
            proxy_pass http://aniq_nextjs_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache ANIQ_CACHE;
            proxy_cache_valid 200 30s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Load Balancer Health Check Endpoint
        location = /api/health {
            proxy_pass http://aniq_nextjs_cluster/api/health;
            access_log off;
        }

        # Default Application Routing
        location / {
            proxy_pass http://aniq_nextjs_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

